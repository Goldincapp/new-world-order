<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Phone Performance Benchmark</title><style>
:root{color-scheme:dark;--gold:#f3c65d;--cyan:#59ddff;--line:#2c4353}*{box-sizing:border-box}body{margin:0;background:#070c10;color:#edf5f7;font:15px/1.4 system-ui,sans-serif;touch-action:manipulation}main{width:min(960px,100%);margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:var(--cyan)}h1{font-size:clamp(26px,7vw,48px);margin:18px 0 5px}p{color:#acc0ca}canvas{display:block;width:100%;height:min(52vh,460px);border:1px solid var(--line);border-radius:14px;background:#101820;touch-action:none}.controls,.results{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}button,select{min-height:48px;border:1px solid var(--line);border-radius:10px;background:#152631;color:#fff;padding:10px;font-weight:800}button.primary{background:var(--gold);color:#1e1908;border-color:#ffe59a}.metric{background:#101a21;border:1px solid var(--line);border-radius:10px;padding:10px}.metric b{display:block;font-size:24px}.metric small{color:#91a7b2}.help{padding:12px;border-left:3px solid var(--gold);background:#191a11}.hidden{display:none}@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}.results{grid-template-columns:1fr 1fr}}
</style></head><body><main><div class="top"><a href="/">← Playtest Lab</a><span id="device"></span></div><h1>Phone performance</h1><p>A 12-second canvas workload modelled on the operation effects. Drag through the arena while it runs; the test also measures input-to-frame delay.</p><canvas id="c"></canvas><div class="controls"><select id="stress" aria-label="Stress level"><option value="1">Normal load</option><option value="1.7">Heavy combat</option><option value="2.5">Worst case</option></select><button class="primary" id="start">Run 12-second test</button><button id="export" disabled>Export result</button></div><div id="result" class="hidden"><div class="results"><div class="metric"><small>Average FPS</small><b id="fps">—</b></div><div class="metric"><small>95th-percentile frame</small><b id="p95">—</b></div><div class="metric"><small>Frames over 33 ms</small><b id="slow">—</b></div><div class="metric"><small>Input response</small><b id="input">—</b></div><div class="metric"><small>Resolution rendered</small><b id="resolution">—</b></div><div class="metric"><small>Verdict</small><b id="verdict">—</b></div></div><p class="help" id="explain"></p></div></main><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d',{alpha:false}),start=document.querySelector('#start'),exp=document.querySelector('#export'),result=document.querySelector('#result');let running=false,frames=[],inputs=[],pendingInput=0,last=0,began=0,latest=null,actors=[];document.querySelector('#device').textContent=`${innerWidth}×${innerHeight} · ${devicePixelRatio}x`;
function resize(){const r=c.getBoundingClientRect(),scale=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*scale);c.height=Math.round(r.height*scale)}addEventListener('resize',resize);resize();
function resetActors(mult){actors=Array.from({length:Math.round(90*mult)},(_,i)=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.16,r:2+Math.random()*8,h:i%3}));}
function draw(t){const w=c.width,h=c.height;ctx.fillStyle='#091119';ctx.fillRect(0,0,w,h);const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#172b36');g.addColorStop(1,'#351b28');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#28414c';ctx.lineWidth=1;for(let x=0;x<w;x+=w/18){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=h/12){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(const a of actors){a.x+=a.vx/60;a.y+=a.vy/60;if(a.x<0||a.x>1)a.vx*=-1;if(a.y<0||a.y>1)a.vy*=-1;const x=a.x*w,y=a.y*h,r=a.r*devicePixelRatio;ctx.shadowBlur=18;ctx.shadowColor=a.h===0?'#ff5c56':a.h===1?'#59ddff':'#f3c65d';ctx.fillStyle=ctx.shadowColor;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff8';ctx.beginPath();ctx.moveTo(x-r*2,y);ctx.lineTo(x+r*2,y);ctx.stroke()}ctx.fillStyle='#ffffffdd';ctx.font=`${12*devicePixelRatio}px system-ui`;ctx.fillText(running?'DRAG / PRESS TO TEST INPUT':'READY',14*devicePixelRatio,24*devicePixelRatio)}
function frame(t){if(!last)last=t;const dt=t-last;last=t;if(running){frames.push(dt);if(pendingInput){inputs.push(t-pendingInput);pendingInput=0}draw(t);if(t-began>=12000)return finish();requestAnimationFrame(frame)}else draw(t)}
function percentile(a,p){const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(s.length*p))]||0}
function finish(){running=false;const duration=frames.reduce((a,b)=>a+b,0),fps=frames.length/(duration/1000),p95=percentile(frames,.95),slow=frames.filter(x=>x>33.34).length,lat=inputs.length?inputs.reduce((a,b)=>a+b,0)/inputs.length:null;const verdict=fps>=55&&p95<25?'Good':fps>=40&&p95<40?'Playable':'Needs work';latest={at:new Date().toISOString(),stress:document.querySelector('#stress').selectedOptions[0].textContent,fps:+fps.toFixed(1),p95Ms:+p95.toFixed(1),framesOver33ms:slow,totalFrames:frames.length,inputLatencyMs:lat==null?null:+lat.toFixed(1),viewport:[innerWidth,innerHeight],renderPixels:[c.width,c.height],devicePixelRatio,hardwareConcurrency:navigator.hardwareConcurrency||null,deviceMemory:navigator.deviceMemory||null,userAgent:navigator.userAgent,verdict};for(const [id,v] of Object.entries({fps:latest.fps,p95:latest.p95Ms+' ms',slow:`${slow} / ${frames.length}`,input:lat==null?'Press next run':latest.inputLatencyMs+' ms',resolution:`${c.width}×${c.height}`,verdict}))document.querySelector('#'+id).textContent=v;document.querySelector('#explain').textContent=verdict==='Good'?'Frame pacing looks healthy under this load. Confirm inside each real operation.':verdict==='Playable'?'Usable, but visible stutter may appear during attacks. Compare Normal and Heavy Combat.':'This device is dropping enough frames to affect control. Export this result before changing effects or art.';result.classList.remove('hidden');exp.disabled=false;start.disabled=false;start.textContent='Run again';draw(performance.now())}
start.onclick=()=>{running=true;frames=[];inputs=[];pendingInput=0;last=0;began=performance.now();resetActors(+document.querySelector('#stress').value);start.disabled=true;result.classList.add('hidden');requestAnimationFrame(frame)};for(const type of ['pointerdown','pointermove'])c.addEventListener(type,()=>{if(running&&!pendingInput)pendingInput=performance.now()},{passive:true});exp.onclick=()=>{const blob=new Blob([JSON.stringify(latest,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`phone-performance-${Date.now()}.json`;a.click();URL.revokeObjectURL(a.href)};draw(0);
</script></body></html>
