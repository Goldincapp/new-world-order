<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Last Stand tower preview</title>
  <style>
    html,body,canvas{width:100%;height:100%;margin:0;display:block;overflow:hidden;background:radial-gradient(circle at 50% 30%,#526b62,#17231f 68%)}
    .title{position:fixed;inset:24px auto auto 50%;z-index:2;transform:translateX(-50%);color:#f4eee1;text-align:center;font:700 14px system-ui;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 6px #000}
    .title b{display:block;color:#ffd36a;font-size:24px;letter-spacing:.02em;text-transform:none}
    .labels{position:fixed;left:0;right:0;bottom:28px;z-index:2;display:flex;justify-content:center;gap:160px;color:#fff;font:800 20px system-ui;text-shadow:0 2px 6px #000}.labels span{width:210px;text-align:center}.labels small{display:block;margin-top:5px;color:#b8c8c3;font-size:12px;font-weight:600}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <div class="title"><b>Last Stand defensive equipment</b>Live game renderer</div>
  <div class="labels"><span>HQ Autocannon<small>Permanent base defence</small></span><span>Scorcher<small>Short-range flame tower</small></span></div>
  <canvas id="stage"></canvas>
  <script type="module">
    import './operations-3d.js?v=20261027-laststand-towers-2';
    const canvas=document.querySelector('#stage'),stage=window.NWOOperations3D.create(canvas),started=performance.now();
    const actors=[
      {id:'hq',type:'lastStandTurret',x:.36,y:.54,angle:0,scale:1.65,bob:0},
      {id:'scorcher',type:'lastStandScorcher',x:.64,y:.54,angle:0,scale:1.55,bob:0}
    ];
    function frame(now){const t=(now-started)/1000;actors[0].angle=Math.sin(t*.5)*.22;actors[1].angle=Math.sin(t*.55+1)*.22;stage.update('laststand',actors,canvas.clientWidth,canvas.clientHeight,t);requestAnimationFrame(frame)}
    requestAnimationFrame(frame);
  </script>
</body>
</html>
